name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes to branches other than main get fast Linux-only feedback.
        os: ${{ fromJSON(github.event_name == 'push' && github.ref != 'refs/heads/main' && '["ubuntu-22.04"]' || '["macos-latest", "windows-latest", "ubuntu-22.04", "ubuntu-22.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install WebKitGTK build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm svelte-check

      # tauri::generate_context! needs the built frontend in dist/.
      - run: pnpm build

      - run: cargo test
        working-directory: src-tauri

      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - run: pnpm tauri build --debug --no-bundle
