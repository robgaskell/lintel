[package]
name = "lintel"
version = "0.1.0"
description = "A markdown reader and editor"
authors = ["Rob Gaskell"]
license = "MIT"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "lintel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-process = "=2.4.0"
tauri-plugin-store = "=2.5.1"
tauri-plugin-window-state = "=2.5.0"
sha2 = "=0.11.2"
notify = "=9.0.0"
notify-debouncer-full = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
# The TLS set tauri-plugin-updater turns on, so the updater adds no second stack (Ruling 123).
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"

# Tauri's mock runtime, so tests can drive real windows and events.
[dev-dependencies]
tauri = { version = "=2.12.7", features = ["test"] }

# NSWindow, to turn off macOS automatic window tabbing (Ruling 173) and set a window's own
# appearance (Ruling 195); tao already builds both crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAppearance", "NSResponder", "NSWindow"] }
# NSUserDefaults, to turn off AppKit's own window restoration (Ruling 218); already built.
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
# CFStrings for LaunchServices' default-handler call (Ruling 249); already built.
core-foundation = "=0.10.1"
